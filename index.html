<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱️</text></svg>">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c0c0d">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#0c0c0d; --card:#1c1c1e; --card2:#232325; --border:#2f2f31;
  --text:#e9e9ea; --muted:#9a9a9d; --green:#4ade80; --red:#ef4444;
  --mono:ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
#app{max-width:760px;margin:0 auto;padding:0 16px 80px}
button,input,select{font:inherit;color:inherit}
input,select{background:#141416;border:1px solid var(--border);border-radius:8px;padding:8px 10px}
button{background:none;border:none;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}

.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:16px}
.tab{flex:1;text-align:center;padding:14px 2px;font-size:15px;color:var(--muted);border-bottom:2px solid transparent}
.tab.active{color:var(--green);border-bottom-color:var(--green)}

.card{background:var(--card);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot-live{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.also{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.also a{color:var(--green);cursor:pointer;text-decoration:underline}
.project-picker{position:relative}
.project-btn{font-weight:600;font-size:15px;padding:2px 4px;cursor:pointer;display:flex;align-items:center;gap:6px}
.project-btn .caret{color:var(--muted);font-size:11px}
.project-menu{position:absolute;top:calc(100% + 6px);left:0;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:6px;min-width:180px;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:40}
.project-menu-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;cursor:pointer;white-space:nowrap;font-size:14px}
.project-menu-item:hover{background:#2a2a2c}
.project-menu-item .check{width:14px;flex:none;color:var(--green)}
.project-menu-item .pmi-name{flex:1}
.project-menu-item .pencil{opacity:.55;font-size:12px;padding:6px 8px;border-radius:4px}
.project-menu-item .pencil:hover{opacity:1;background:#333}
/* On mouse-driven devices, keep the row's edit/delete buttons tucked away until hovered.
   On touch (no real hover), they stay visible at reduced opacity - there's no hover to reveal them. */
@media (hover:hover) and (pointer:fine){
  .project-menu-item .pencil{opacity:0}
  .project-menu-item:hover .pencil{opacity:.6}
}
.topbar{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:10px 16px;padding:10px 2px;font-size:13px}
.topbar span.linklike{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:45vw}
.icon-btn{opacity:.75;padding:8px 9px;border-radius:6px;font-size:15px}
.icon-btn:hover{opacity:1;background:#2a2a2c}
.linklike{color:var(--muted);font-size:13px;padding:4px}
.linklike:hover{color:var(--text)}

.compose{flex:1;display:flex;gap:10px}
.compose input{flex:1}
.btn-start{background:var(--green);color:#0b1e10;font-weight:700;border-radius:8px;padding:8px 18px;white-space:nowrap}
.btn-start:disabled{background:var(--card2);color:var(--muted);cursor:not-allowed}
.btn-stop{background:var(--red);color:#fff;font-weight:700;border-radius:8px;padding:8px 16px;white-space:nowrap}
.clock{color:var(--green);font-family:var(--mono);font-weight:600}
.title-live{font-weight:600;cursor:pointer}

.tagrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.desc-input{width:100%;margin-top:10px;color:var(--muted);font-size:13px}
.desc-input:focus{color:var(--text)}
.entry-desc{color:var(--muted);font-size:13px;margin-top:4px}
.chip{border:1px solid var(--border);border-radius:16px;padding:6px 10px;color:#c9c9ca;display:flex;align-items:center;gap:6px;font-size:13px}
.chip:hover{border-color:#fff}
.chip.selected{color:var(--chip-c);border-color:var(--chip-c)}
.chip .pencil{opacity:.6;font-size:11px;padding:4px}
.chip .pencil:hover{opacity:1}
.newtag{color:var(--muted);font-size:13px}

.pill{border:1px solid var(--chip-c);background:color-mix(in srgb, var(--chip-c) 18%, transparent);border-radius:12px;padding:2px 8px;font-size:12px;font-weight:600;color:var(--chip-c)}

.daygroup-header{display:flex;justify-content:space-between;font-weight:700;margin:20px 0 8px;padding:0 2px}
.daygroup-header .tot{color:var(--muted);font-weight:600;font-family:var(--mono)}
.entry{background:var(--card);border-radius:8px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.entrygroup .entry{border-radius:0}
.entrygroup .entry+.entry{border-top:1px solid var(--border)}
.entrygroup .entry:first-child{border-top-left-radius:8px;border-top-right-radius:8px}
.entrygroup .entry:last-child{border-bottom-left-radius:8px;border-bottom-right-radius:8px}
.entry-main .title{font-weight:600;margin-bottom:4px}
.entry-main .meta{color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.entry-main .meta b,.entry-main .meta .timerange{font-family:var(--mono)}
.entry-main .meta b{color:var(--text);font-weight:600}
.entry-actions{display:flex;gap:6px;flex:none}
.entry-actions button{font-size:14px}

.editform{display:flex;flex-wrap:wrap;gap:8px;align-items:center;width:100%}
.editform input[type=text]{flex:1;min-width:120px}

.statcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.statcard{background:var(--card);border-radius:10px;padding:14px 16px}
.statcard .label{color:var(--muted);font-size:11px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px}
.statcard .val{color:var(--green);font-size:22px;font-weight:700;font-family:var(--mono)}
.statcard .sub{color:var(--muted);font-size:12px;margin-top:4px}

.section-label{color:var(--muted);font-size:11px;letter-spacing:.05em;text-transform:uppercase;margin:20px 2px 10px}
.range-picker{display:flex;gap:10px;flex-wrap:wrap}
.custom-range{margin:-2px 2px 12px;gap:8px;flex-wrap:wrap}
.custom-range input[type=date]{padding:6px 8px}
.chart-container{display:flex;gap:10px}
.chart-yaxis{flex:none;display:flex;flex-direction:column;justify-content:space-between;height:120px;color:var(--muted);font-size:11px;text-align:right}
.chart-main{flex:1;min-width:0}
.chart{display:flex;align-items:flex-end;gap:4px;height:120px;padding:0 2px}
.chart .bar{flex:1;background:var(--green);border-radius:2px 2px 0 0;min-height:2px}
.chart .bar.empty{background:#333}
.chart-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;padding:4px 2px 0}
.chart-tooltip{
  position:fixed;top:0;left:0;display:none;z-index:100;pointer-events:none;
  background:#000;border-radius:8px;padding:8px 12px;box-shadow:0 6px 20px rgba(0,0,0,.5);
  font-size:13px;white-space:nowrap;
}
.chart-tooltip .tt-date{color:var(--muted);margin-bottom:2px}
.chart-tooltip .tt-val{color:var(--text);font-weight:600;font-family:var(--mono)}
.chart-tooltip .tt-tags{margin-top:6px;padding-top:6px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:4px}
.chart-tooltip .tt-tag{display:flex;align-items:center;gap:16px;justify-content:space-between}
.chart-tooltip .tt-name{display:flex;align-items:center;gap:6px;color:var(--muted)}
.chart-tooltip .tt-dot{width:8px;height:8px;border-radius:2px;flex:none}
.chart-tooltip .tt-tagval{color:var(--text);font-weight:600;font-family:var(--mono)}

.tagbar-row{display:grid;grid-template-columns:110px 1fr 90px;align-items:center;gap:10px;margin-bottom:10px}
.tagbar-row .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tagbar-track{background:#3a3a3c;border-radius:4px;height:8px;overflow:hidden}
.tagbar-fill{height:100%;border-radius:4px}
.tagbar-row .val{text-align:right;color:var(--muted);font-size:13px;font-family:var(--mono)}
.active-range{color:var(--green)}
@media (max-width:380px){
  .tagbar-row{grid-template-columns:78px 1fr 56px;gap:6px}
  .tagbar-row .name{font-size:13px}
}

.floaters{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:50}
.floater{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;display:flex;align-items:center;gap:8px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.floater .clock{font-size:13px}
.empty-log{color:var(--muted);padding:20px 2px}
</style>
</head>
<body>
<div id="app"></div>
<div class="chart-tooltip" id="chart-tooltip"></div>
<script>
"use strict";
const PALETTE=['#5b9bf0','#8b6cf0','#ef4444','#4ade80','#a78bfa','#f97316','#ec4899','#fb7185','#eab308','#d946ef','#22c55e','#06b6d4'];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

const state = {
  tab:'timer', currentProjectId:null,
  projects:[], tags:[], entries:[]
};
const pending={}; // draft {title, tagIds} per project, not persisted
let editingEntryId=null;
let statsRange='30d'; // '7d' | '30d' | '90d' | 'month' | 'all' | 'custom', not persisted
let customStart=null, customEnd=null; // yyyy-mm-dd, only used when statsRange==='custom'
let projectMenuOpen=false; // not persisted
const RANGE_LABELS={'7d':'7 days','30d':'30 days','90d':'90 days','month':'This month','all':'All time','custom':'Custom'};
// A running session is just an entry with end=null (pauseStart set while paused).

function nextColor(list){ return PALETTE[list.length % PALETTE.length]; }

// ---------- cloud storage (required - all data lives in Firebase, nothing local) ----------
// From a Firebase project (console.firebase.google.com -> Project settings ->
// General -> Your apps -> SDK setup and configuration).
const firebaseConfig = {
  apiKey: "AIzaSyC1mN9x_lxYlMI9Bl5ZcOwy_nvSeYAu7Ok",
  authDomain: "time-tracker-cadcf.firebaseapp.com",
  projectId: "time-tracker-cadcf",
  storageBucket: "time-tracker-cadcf.firebasestorage.app",
  messagingSenderId: "382064892950",
  appId: "1:382064892950:web:00c14a15051814909b2937"
};

// Schema: tt/{uid} holds the small stuff (projects, tags). Sessions live in their
// own subcollection, tt/{uid}/entries/{entryId} - one document each - so history
// can grow without limit instead of bumping into Firestore's 1MiB per-document cap.
let authUser=null, syncDoc=null, unsubEntries=null, pushTimer=null, authError=null, approvalPending=false;
firebase.initializeApp(firebaseConfig);
// Signing in only proves who someone is - it doesn't grant access. Firestore rules
// require the signed-in email to have an /allowlist/{email} document (added by the
// admin in the Firebase console) before any read/write to /tt/{uid} succeeds. An
// unapproved account gets a permission-denied error here, which flips approvalPending.
firebase.auth().onAuthStateChanged(user=>{
  authUser=user; authError=null; approvalPending=false;
  // Reset in-memory state on every identity change (sign-out, sign-in, switching
  // accounts) so a fresh/different account never briefly shows the previous
  // session's data - it stays cleared until (if) this account's own data loads.
  state.projects=[]; state.tags=[]; state.entries=[]; state.currentProjectId=null;
  if(unsubEntries){ unsubEntries(); unsubEntries=null; }
  syncDoc = user ? firebase.firestore().collection('tt').doc(user.uid) : null;
  if(syncDoc){
    const onDenied = err=>{ if(err.code==='permission-denied'){ approvalPending=true; render(); } };
    syncDoc.onSnapshot(snap=>{
      if(snap.metadata.hasPendingWrites) return; // echo of our own write, already applied
      const data = snap.data(); if(!data) return;
      state.projects=data.projects||[]; state.tags=data.tags||[];
      if(!project(state.currentProjectId)) state.currentProjectId = state.projects[0]?.id||null;
      render();
    }, onDenied);
    unsubEntries = syncDoc.collection('entries').onSnapshot(snap=>{
      if(snap.metadata.hasPendingWrites) return;
      state.entries = snap.docs.map(d=>({id:d.id, ...d.data()}));
      render();
    }, onDenied);
  }
  render();
});
// Projects/tags are small and change rarely - keep pushing the whole pair as one doc.
function saveMeta(){
  if(!syncDoc) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(()=>{
    syncDoc.set({projects:state.projects, tags:state.tags});
  }, 400);
}
// Each session is its own document, written directly (no debounce needed - these
// are one-shot clicks/prompts, never live-typing).
function saveEntry(id){
  if(!syncDoc) return;
  const {id:_drop, ...data} = state.entries.find(x=>x.id===id);
  syncDoc.collection('entries').doc(id).set(data);
}
function deleteEntryRemote(id){
  if(!syncDoc) return;
  syncDoc.collection('entries').doc(id).delete();
}

// ---------- formatting ----------
function fmtDur(ms){
  let s=Math.max(0,Math.round(ms/1000));
  const h=Math.floor(s/3600); s-=h*3600;
  const m=Math.floor(s/60); s-=m*60;
  if(h>0) return `${h} h ${m} min`;
  if(m>0) return `${m} min ${s} sec`;
  return `${s} sec`;
}
function fmtClock(ms){
  let s=Math.max(0,Math.floor(ms/1000));
  const h=Math.floor(s/3600); s-=h*3600;
  const m=Math.floor(s/60); s-=m*60;
  return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function fmtTime(ts){ const d=new Date(ts); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function dayKey(ts){ const d=new Date(ts); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; }
function dayLabel(ts){ return new Date(ts).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}); }
function toLocalInput(ts){ const d=new Date(ts); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }
function toDateInput(d){ const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
function parseDateInput(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
// Compact duration for chart axis labels ("2.5h", "45m", "0") - fmtDur is too verbose here.
function fmtDurShort(ms){
  if(ms<60000) return '0';
  const mins=ms/60000;
  if(mins<60) return `${Math.round(mins)}m`;
  const h=mins/60;
  return `${h>=10?Math.round(h):Math.round(h*10)/10}h`;
}

// ---------- data helpers ----------
const project = id => state.projects.find(p=>p.id===id);
const projectTags = pid => state.tags.filter(t=>t.projectId===pid);
const curProject = () => project(state.currentProjectId);
function isRunning(e){ return e.end==null; }
function entryDur(e){ const end = isRunning(e) ? (e.pauseStart||Date.now()) : e.end; return end - e.start; }

// ---------- render ----------
function render(){
  const app0=document.getElementById('app');
  if(!authUser){
    app0.innerHTML = `
      <form class="card" style="max-width:320px;margin:60px auto;padding:24px;display:flex;flex-direction:column;gap:10px" data-action="auth-form">
        <p style="color:var(--muted);margin:0 0 4px;text-align:center">Sign in to access your data</p>
        <input type="email" name="email" placeholder="Email" required autocomplete="email">
        <input type="password" name="password" placeholder="Password" required autocomplete="current-password" minlength="6">
        ${authError?`<div style="color:var(--red);font-size:13px">${escapeHtml(authError)}</div>`:''}
        <button class="btn-start" type="submit">Sign in</button>
        <button class="linklike" type="button" data-action="auth-signup">Create account</button>
        <button class="linklike" type="button" data-action="auth-reset">Forgot password?</button>
      </form>`;
    return;
  }
  if(approvalPending){
    app0.innerHTML = `
      <div class="card" style="max-width:360px;margin:60px auto;padding:24px;text-align:center">
        <p style="color:var(--text);margin-top:0">You're signed in, but this account hasn't been approved yet.</p>
        <p style="color:var(--muted);font-size:13px">Ask the admin to grant ${escapeHtml(authUser.email||'this account')} access.</p>
        <button class="linklike" data-action="sign-out">Sign out</button>
      </div>`;
    return;
  }
  if(!state.projects.length){
    app0.innerHTML = `
      ${renderTopBar()}
      <div class="tabs"><span class="tab active">Timer</span></div>
      <div class="card row between">
        <span style="color:var(--muted)">No projects yet</span>
        <button class="linklike" data-action="new-project">+ New Project</button>
      </div>`;
    return;
  }
  const p=curProject();
  const app=document.getElementById('app');
  app.innerHTML = `
    ${renderTopBar()}
    <div class="tabs">
      <button class="tab ${state.tab==='timer'?'active':''}" data-action="tab" data-tab="timer">Timer</button>
      <button class="tab ${state.tab==='stats'?'active':''}" data-action="tab" data-tab="stats">Statistics</button>
    </div>
    ${renderProjectBar(p)}
    ${state.tab==='timer' ? renderTimerTab(p) : renderStatsTab(p)}
    ${renderFloaters()}
  `;
}

function renderTopBar(){
  return `<div class="topbar">
    <button class="linklike" data-action="download-data" title="Download all your data as JSON">⬇ Export</button>
    <span class="linklike" title="${escapeHtml(authUser.email||'')}">${escapeHtml(authUser.displayName||authUser.email||'Signed in')}</span>
    <button class="linklike" data-action="sign-out">Sign out</button>
  </div>`;
}

function renderProjectBar(p){
  const runningProjectIds = new Set(state.entries.filter(isRunning).map(e=>e.projectId));
  const others = [...runningProjectIds].filter(id=>id!==p.id && project(id));
  const alsoRunning = others.map(id=>`<a data-action="switch-project" data-id="${id}">${escapeHtml(project(id).name)}</a>`).join(', ');
  return `
  <div class="card row between">
    <div class="row">
      <span class="dot" style="background:${p.color}"></span>
      <div class="project-picker">
        <button class="project-btn" data-action="toggle-project-menu">${escapeHtml(p.name)}<span class="caret">⌄</span></button>
        ${projectMenuOpen?`<div class="project-menu">
          ${state.projects.map(pr=>`<div class="project-menu-item" data-action="switch-project" data-id="${pr.id}">
            <span class="check">${pr.id===p.id?'✓':''}</span>
            <span class="pmi-name">${escapeHtml(pr.name)}</span>
            <button class="pencil" data-action="edit-project-row" data-id="${pr.id}" title="Rename project">✎</button>
            <button class="pencil" data-action="delete-project-row" data-id="${pr.id}" title="Delete project">×</button>
          </div>`).join('')}
        </div>`:''}
      </div>
      ${alsoRunning?`<span class="also"><span class="dot dot-live" style="background:var(--green)"></span>Also running: ${alsoRunning}</span>`:''}
    </div>
    <div class="row">
      <button class="linklike" data-action="new-project">+ New Project</button>
    </div>
  </div>`;
}

function renderFloaters(){
  const items = state.entries.filter(e=>isRunning(e) && project(e.projectId));
  if(!items.length) return '';
  return `<div class="floaters">${items.map(t=>{
    const pr=project(t.projectId);
    return `<div class="floater" data-action="switch-project" data-id="${t.projectId}">
      <span class="dot ${t.pauseStart?'':'dot-live'}" style="background:${pr.color}"></span>
      <span>${escapeHtml(t.title)}</span>
      <span class="clock live-clock" data-start="${t.start}" data-pausestart="${t.pauseStart||''}">${fmtClock(entryDur(t))}</span>
    </div>`;
  }).join('')}</div>`;
}

function renderTagRow(p, selectedIds, timerId){
  const tags=projectTags(p.id);
  return `<div class="tagrow">
    ${tags.map(t=>`<span class="chip ${selectedIds.includes(t.id)?'selected':''}" style="--chip-c:${t.color}" data-action="toggle-tag" data-id="${t.id}" ${timerId?`data-timer="${timerId}"`:''}>
        ${escapeHtml(t.name)}<button class="pencil" data-action="edit-tag" data-id="${t.id}">✎</button>
      </span>`).join('')}
    <button class="newtag" data-action="new-tag">+ New tag</button>
  </div>`;
}

function renderTimerTab(p){
  const draft = pending[p.id] || {title:'', tagIds:[], description:''};
  const runningTimers = state.entries.filter(e=>e.projectId===p.id && isRunning(e));
  const running = runningTimers.map(t=>`
    <div class="card">
      <div class="row between">
        <span class="title-live" data-action="rename-timer" data-id="${t.id}">${escapeHtml(t.title)}</span>
        <div class="row">
          <span class="dot ${t.pauseStart?'':'dot-live'}" style="background:${p.color}"></span>
          <span class="clock live-clock" data-start="${t.start}" data-pausestart="${t.pauseStart||''}">${fmtClock(entryDur(t))}</span>
          <button class="icon-btn" data-action="pause" data-id="${t.id}">${t.pauseStart?'▶':'⏸'}</button>
          <button class="icon-btn" data-action="rename-timer" data-id="${t.id}">✎</button>
          <button class="btn-stop" data-action="stop" data-id="${t.id}">■ Stop</button>
        </div>
      </div>
      <input type="text" class="desc-input" placeholder="Add a description..." value="${escapeHtml(t.description||'')}" data-action="entry-desc" data-id="${t.id}">
      ${renderTagRow(p, t.tagIds, t.id)}
    </div>`).join('');
  const composer = `
    <div class="card">
      <div class="row">
        <div class="compose">
          <input type="text" placeholder="Title" value="${escapeHtml(draft.title)}" data-action="draft-title">
        </div>
        <button class="btn-start" data-action="start" ${draft.title.trim()?'':'disabled title="Enter a title to start the timer"'}>▶ Start</button>
      </div>
      <input type="text" class="desc-input" placeholder="(Optional) Description..." value="${escapeHtml(draft.description||'')}" data-action="draft-desc">
      ${renderTagRow(p, draft.tagIds)}
    </div>`;
  return `${running}${composer}${renderLog(p)}`;
}

function renderLog(p){
  const entries = state.entries.filter(e=>e.projectId===p.id && !isRunning(e)).sort((a,b)=>b.start-a.start);
  if(!entries.length) return `<div class="empty-log">No sessions logged yet. Start a timer above.</div>`;
  const groups=[]; const byKey={};
  for(const e of entries){
    const k=dayKey(e.start);
    if(!byKey[k]){ byKey[k]={label:dayLabel(e.start), list:[], total:0}; groups.push(byKey[k]); }
    byKey[k].list.push(e); byKey[k].total+=entryDur(e);
  }
  return groups.map(g=>`
    <div class="daygroup-header"><span>${g.label}</span><span class="tot">${fmtDur(g.total)}</span></div>
    <div class="entrygroup">${g.list.map(e=>renderEntry(p,e)).join('')}</div>
  `).join('');
}

function renderEntry(p,e){
  if(editingEntryId===e.id) return renderEntryEdit(p,e);
  const tags=e.tagIds.map(id=>state.tags.find(t=>t.id===id)).filter(Boolean);
  return `<div class="entry">
    <div class="entry-main">
      <div class="title">${escapeHtml(e.title)}</div>
      <div class="meta">
        <b>${fmtDur(entryDur(e))}</b>
        <span class="timerange">${fmtTime(e.start)} – ${fmtTime(e.end)}</span>
        ${tags.map(t=>`<span class="pill" style="--chip-c:${t.color}">${escapeHtml(t.name)}</span>`).join('')}
      </div>
      ${e.description?`<div class="entry-desc">${escapeHtml(e.description)}</div>`:''}
    </div>
    <div class="entry-actions">
      <button class="icon-btn" data-action="restart-entry" data-id="${e.id}" title="Start new timer like this">▶</button>
      <button class="icon-btn" data-action="edit-entry" data-id="${e.id}">✎</button>
      <button class="icon-btn" data-action="delete-entry" data-id="${e.id}">×</button>
    </div>
  </div>`;
}

function renderEntryEdit(p,e){
  return `<div class="entry">
    <form class="editform" data-action="save-entry" data-id="${e.id}">
      <input type="text" name="title" value="${escapeHtml(e.title)}">
      <input type="datetime-local" name="start" value="${toLocalInput(e.start)}">
      <input type="datetime-local" name="end" value="${toLocalInput(e.end)}">
      <input type="text" name="description" placeholder="Description" value="${escapeHtml(e.description||'')}" style="width:100%">
      ${renderTagRow(p, e.tagIds).replaceAll('data-action="toggle-tag"','data-action="toggle-edit-tag"')}
      <button class="linklike" type="submit">Save</button>
      <button class="linklike" type="button" data-action="cancel-edit-entry">Cancel</button>
    </form>
  </div>`;
}

function renderStatsTab(p){
  const entries = state.entries.filter(e=>e.projectId===p.id && !isRunning(e));
  const total = entries.reduce((s,e)=>s+entryDur(e),0);
  const longest = entries.reduce((a,e)=> !a||entryDur(e)>entryDur(a) ? e : a, null);
  const byDay={};
  for(const e of entries){ const k=dayKey(e.start); byDay[k]=(byDay[k]||0)+entryDur(e); }
  let recordKey=null;
  for(const k in byDay) if(recordKey===null||byDay[k]>byDay[recordKey]) recordKey=k;
  const recordDate = recordKey!==null ? entries.find(e=>dayKey(e.start)===recordKey) : null;

  const now=new Date();
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  let startDay=today, endDay=today, rangeLabel=RANGE_LABELS[statsRange];
  if(statsRange==='custom'){
    const endStr=customEnd||toDateInput(today);
    const startStr=customStart||toDateInput(new Date(today.getFullYear(),today.getMonth(),today.getDate()-29));
    startDay=parseDateInput(startStr); endDay=parseDateInput(endStr);
    if(endDay<startDay) [startDay,endDay]=[endDay,startDay];
  } else if(statsRange==='month'){
    startDay=new Date(today.getFullYear(),today.getMonth(),1);
  } else if(statsRange==='all'){
    startDay = entries.length ? (()=>{ const e=new Date(Math.min(...entries.map(x=>x.start))); return new Date(e.getFullYear(),e.getMonth(),e.getDate()); })() : today;
  } else {
    const n={'7d':7,'30d':30,'90d':90}[statsRange]||30;
    startDay=new Date(today.getFullYear(),today.getMonth(),today.getDate()-(n-1));
  }
  const spanDays=Math.round((endDay-startDay)/86400000)+1;
  const projTags=projectTags(p.id);
  const days=[];
  for(let i=0;i<spanDays;i++){
    const d=new Date(startDay.getFullYear(),startDay.getMonth(),startDay.getDate()+i);
    const k=`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
    const dayEntries=entries.filter(e=>dayKey(e.start)===k);
    const untaggedVal=dayEntries.filter(e=>!e.tagIds.length).reduce((s,e)=>s+entryDur(e),0);
    const tagBreakdown=[...projTags.map(t=>({name:t.name,color:t.color,
        val:dayEntries.filter(e=>e.tagIds.includes(t.id)).reduce((s,e)=>s+entryDur(e),0)})),
      {name:'(no tag)',color:'var(--muted)',val:untaggedVal}]
      .filter(x=>x.val>0).sort((a,b)=> a.name==='(no tag)'?1 : b.name==='(no tag)'?-1 : b.val-a.val);
    days.push({key:k, val: byDay[k]||0, date:d, tagBreakdown});
  }
  const maxDay=Math.max(1,...days.map(d=>d.val));
  const fmtAxisDate=d=> (d.getFullYear()===today.getFullYear()&&d.getMonth()===today.getMonth()&&d.getDate()===today.getDate())
    ? 'today' : d.toLocaleDateString('en-US',{month:'short',day:'numeric'});

  const untaggedTotal=entries.filter(e=>!e.tagIds.length).reduce((s,e)=>s+entryDur(e),0);
  const tagTotals=[...projectTags(p.id).map(t=>({t, val: entries.filter(e=>e.tagIds.includes(t.id)).reduce((s,e)=>s+entryDur(e),0)})),
      ...(untaggedTotal>0 ? [{t:{name:'(no tag)',color:'var(--muted)'}, val: untaggedTotal}] : [])]
    .sort((a,b)=> a.t.name==='(no tag)'?1 : b.t.name==='(no tag)'?-1 : b.val-a.val);
  const maxTag=Math.max(1,...tagTotals.map(x=>x.val));

  return `
  <div class="statcards">
    <div class="statcard"><div class="label">Total Time</div><div class="val">${fmtDur(total)}</div></div>
    <div class="statcard"><div class="label">Sessions</div><div class="val">${entries.length}</div></div>
    <div class="statcard"><div class="label">Longest Session</div><div class="val">${longest?fmtDur(entryDur(longest)):'—'}</div><div class="sub">${longest?escapeHtml(longest.title):''}</div></div>
    <div class="statcard"><div class="label">Day Record</div><div class="val">${recordDate?fmtDur(byDay[recordKey]):'—'}</div><div class="sub">${recordDate?dayLabel(recordDate.start):''}</div></div>
  </div>
  <div class="section-label row between" style="align-items:flex-start;flex-wrap:wrap;gap:8px">
    <span>${rangeLabel}</span>
    <span class="row range-picker">
      ${['7d','30d','90d','month','all','custom'].map(r=>`<button class="linklike ${statsRange===r?'active-range':''}" data-action="stats-range" data-range="${r}">${RANGE_LABELS[r]}</button>`).join('')}
    </span>
  </div>
  ${statsRange==='custom'?`
  <div class="row custom-range">
    <input type="date" value="${toDateInput(startDay)}" max="${toDateInput(today)}" data-action="custom-start">
    <span style="color:var(--muted)">to</span>
    <input type="date" value="${toDateInput(endDay)}" max="${toDateInput(today)}" data-action="custom-end">
  </div>`:''}
  <div class="chart-container">
    <div class="chart-yaxis">
      <span>${fmtDurShort(maxDay)}</span>
      <span>${fmtDurShort(maxDay/2)}</span>
      <span>0h</span>
    </div>
    <div class="chart-main">
      <div class="chart">${days.map(d=>`<div class="bar ${d.val?'':'empty'}" style="height:${Math.max(2,d.val/maxDay*100)}%" data-date="${escapeHtml(dayLabel(d.date))}" data-val="${escapeHtml(fmtDur(d.val))}" data-tags="${escapeHtml(JSON.stringify(d.tagBreakdown))}"></div>`).join('')}</div>
      <div class="chart-labels"><span>${days.length?fmtAxisDate(days[0].date):''}</span><span>${days.length?fmtAxisDate(days[days.length-1].date):''}</span></div>
    </div>
  </div>
  <div class="section-label">Time per tag</div>
  ${tagTotals.length?tagTotals.map(x=>`
    <div class="tagbar-row">
      <span class="name" style="color:${x.t.color}">${escapeHtml(x.t.name)}</span>
      <div class="tagbar-track"><div class="tagbar-fill" style="width:${x.val/maxTag*100}%;background:${x.t.color}"></div></div>
      <span class="val">${fmtDur(x.val)}</span>
    </div>`).join(''):`<div class="empty-log">No tags yet.</div>`}
  `;
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ---------- export ----------
function downloadData(){
  // Exactly what's stored (and synced to Firebase, if signed in) - no reformatting.
  const data = {projects:state.projects, tags:state.tags, entries:state.entries};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`time-tracker-export-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

// ---------- actions ----------
const chartTooltip=document.getElementById('chart-tooltip');
function tooltipHtml(bar){
  const tags=JSON.parse(bar.dataset.tags||'[]');
  const tagsHtml=tags.length?`<div class="tt-tags">${tags.map(t=>
    `<div class="tt-tag"><span class="tt-name"><span class="tt-dot" style="background:${t.color}"></span>${escapeHtml(t.name)}</span><span class="tt-tagval">${fmtDur(t.val)}</span></div>`
  ).join('')}</div>`:'';
  return `<div class="tt-date">${bar.dataset.date}</div><div class="tt-val">${bar.dataset.val}</div>${tagsHtml}`;
}
document.addEventListener('mouseover', e=>{
  const bar=e.target.closest('.chart .bar');
  if(!bar) return;
  chartTooltip.innerHTML=tooltipHtml(bar);
  chartTooltip.style.left=(e.clientX+14)+'px';
  chartTooltip.style.top=(e.clientY+14)+'px';
  chartTooltip.style.display='block';
});
document.addEventListener('mousemove', e=>{
  if(chartTooltip.style.display!=='block') return;
  if(!e.target.closest('.chart .bar')){ chartTooltip.style.display='none'; return; }
  chartTooltip.style.left=(e.clientX+14)+'px';
  chartTooltip.style.top=(e.clientY+14)+'px';
});
document.addEventListener('mouseout', e=>{
  if(e.target.closest('.chart .bar') && !e.relatedTarget?.closest?.('.chart .bar')) chartTooltip.style.display='none';
});
// Touch has no hover, so mouseover/mousemove above never fire on phones - tap a bar to
// show its tooltip instead (positioned above the touch point so the finger doesn't
// cover it), tap anywhere else to dismiss.
document.addEventListener('touchstart', e=>{
  const bar=e.target.closest('.chart .bar');
  if(!bar){ chartTooltip.style.display='none'; return; }
  const touch=e.touches[0];
  chartTooltip.innerHTML=tooltipHtml(bar);
  chartTooltip.style.left=Math.min(touch.clientX+14, window.innerWidth-180)+'px';
  chartTooltip.style.top=Math.max(0, touch.clientY-70)+'px';
  chartTooltip.style.display='block';
}, {passive:true});
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-action]');
  if(!el){
    if(projectMenuOpen){ projectMenuOpen=false; render(); }
    return;
  }
  const a = el.dataset.action;
  if(projectMenuOpen && a!=='toggle-project-menu') projectMenuOpen=false;
  const p = curProject();

  if(a==='toggle-project-menu'){ projectMenuOpen=!projectMenuOpen; render(); return; }

  if(a==='tab'){ state.tab=el.dataset.tab; render(); return; }

  if(a==='switch-project'){ state.currentProjectId=el.dataset.id; editingEntryId=null; render(); return; }

  if(a==='new-project'){
    const name=prompt('Project name'); if(!name) return;
    const pr={id:uid(),name:name.trim(),color:nextColor(state.projects)};
    state.projects.push(pr); state.currentProjectId=pr.id; saveMeta(); render(); return;
  }
  if(a==='edit-project-row'){
    const pr=state.projects.find(x=>x.id===el.dataset.id);
    const name=prompt('Rename project', pr.name);
    if(name===null||!name.trim()) return;
    pr.name=name.trim(); saveMeta(); render(); return;
  }
  if(a==='delete-project-row'){
    const pr=state.projects.find(x=>x.id===el.dataset.id);
    if(!confirm(`Delete project "${pr.name}"? This also deletes all its tags and logged sessions - this cannot be undone.`)) return;
    state.projects=state.projects.filter(x=>x.id!==pr.id);
    state.tags=state.tags.filter(x=>x.projectId!==pr.id);
    const toRemove=state.entries.filter(e=>e.projectId===pr.id);
    state.entries=state.entries.filter(e=>e.projectId!==pr.id);
    toRemove.forEach(e=>deleteEntryRemote(e.id));
    if(state.currentProjectId===pr.id) state.currentProjectId = state.projects[0]?.id||null;
    saveMeta(); render(); return;
  }

  if(a==='new-tag'){
    const name=prompt('Tag name'); if(!name) return;
    state.tags.push({id:uid(),projectId:p.id,name:name.trim(),color:nextColor(projectTags(p.id))});
    saveMeta(); render(); return;
  }
  if(a==='edit-tag'){
    const t=state.tags.find(t=>t.id===el.dataset.id);
    const name=prompt('Rename tag (clear text + OK to delete)', t.name);
    if(name===null) return;
    if(!name.trim()){
      if(confirm(`Delete tag "${t.name}"?`)){
        state.tags=state.tags.filter(x=>x.id!==t.id);
        const affected=state.entries.filter(en=>en.tagIds.includes(t.id));
        affected.forEach(en=>{ en.tagIds=en.tagIds.filter(id=>id!==t.id); saveEntry(en.id); });
      }
    } else t.name=name.trim();
    saveMeta(); render(); return;
  }
  if(a==='toggle-tag'){
    const tid=el.dataset.id, timerId=el.dataset.timer;
    if(timerId){
      const t=state.entries.find(x=>x.id===timerId);
      t.tagIds = t.tagIds.includes(tid) ? t.tagIds.filter(x=>x!==tid) : [...t.tagIds, tid];
      saveEntry(timerId);
    } else {
      // Draft (not-yet-started) tag picks are local only - nothing to sync until Start.
      const d = pending[p.id] || {title:'',tagIds:[]};
      d.tagIds = d.tagIds.includes(tid) ? d.tagIds.filter(x=>x!==tid) : [...d.tagIds, tid];
      pending[p.id]=d;
    }
    render(); return;
  }

  if(a==='start'){
    const d = pending[p.id] || {title:'',tagIds:[]};
    const title=(d.title||'').trim();
    if(!title) return; // Start button is disabled until a title is entered; this is just a safety net.
    const id=uid();
    state.entries.push({id, projectId:p.id, title, tagIds:[...d.tagIds], description:(d.description||'').trim(), start:Date.now(), end:null, pauseStart:null});
    delete pending[p.id]; saveEntry(id); render(); return;
  }
  if(a==='pause'){
    const t=state.entries.find(x=>x.id===el.dataset.id);
    // Paused time isn't tracked separately - resuming just shifts start forward
    // by however long the pause lasted, so it's excluded from the duration.
    if(t.pauseStart){ t.start += Date.now()-t.pauseStart; t.pauseStart=null; }
    else t.pauseStart=Date.now();
    saveEntry(t.id); render(); return;
  }
  if(a==='rename-timer'){
    const t=state.entries.find(x=>x.id===el.dataset.id);
    const name=prompt('Timer title', t.title); if(name===null) return;
    const title=name.trim();
    if(!title){ alert('Title cannot be empty.'); return; }
    t.title=title; saveEntry(t.id); render(); return;
  }
  if(a==='stop'){
    const t=state.entries.find(x=>x.id===el.dataset.id);
    if(t.pauseStart){ t.start += Date.now()-t.pauseStart; t.pauseStart=null; }
    t.end=Date.now();
    saveEntry(t.id); render(); return;
  }

  if(a==='restart-entry'){
    const src=state.entries.find(x=>x.id===el.dataset.id);
    const id=uid();
    state.entries.push({id, projectId:p.id, title:src.title, tagIds:[...src.tagIds], description:src.description||'', start:Date.now(), end:null, pauseStart:null});
    saveEntry(id); render(); return;
  }
  if(a==='edit-entry'){ editingEntryId=el.dataset.id; render(); return; }
  if(a==='cancel-edit-entry'){ editingEntryId=null; render(); return; }
  if(a==='delete-entry'){
    if(confirm('Delete this session?')){
      const id=el.dataset.id;
      state.entries=state.entries.filter(x=>x.id!==id);
      deleteEntryRemote(id);
    }
    render(); return;
  }
  if(a==='toggle-edit-tag'){
    const en=state.entries.find(x=>x.id===editingEntryId), tid=el.dataset.id;
    en.tagIds = en.tagIds.includes(tid) ? en.tagIds.filter(x=>x!==tid) : [...en.tagIds, tid];
    saveEntry(en.id); render(); return;
  }

  if(a==='auth-signup'){
    // Anyone can create an Auth account - that's unavoidable for a client-only
    // app (firebaseConfig is public by necessity). It doesn't matter: the
    // Firestore rules still gate all data behind the allowlist, so a self-signed-up
    // account gets nothing until the admin approves its email there.
    const form=el.closest('form');
    const email=form.email.value.trim(), password=form.password.value;
    if(!email||password.length<6){ authError='Enter an email and a password (6+ characters).'; render(); return; }
    firebase.auth().createUserWithEmailAndPassword(email,password)
      .catch(err=>{ authError=err.message; render(); });
    return;
  }
  if(a==='auth-reset'){
    const form=el.closest('form');
    const email=form.email.value.trim();
    if(!email){ authError='Enter your email above first, then click "Forgot password?" again.'; render(); return; }
    firebase.auth().sendPasswordResetEmail(email)
      .then(()=>{ authError=null; alert('Password reset email sent to '+email); })
      .catch(err=>{ authError=err.message; render(); });
    return;
  }
  if(a==='sign-out'){ firebase.auth().signOut(); return; }

  if(a==='stats-range'){
    statsRange=el.dataset.range;
    if(statsRange==='custom' && !customStart){
      const today=new Date();
      customEnd=toDateInput(today);
      customStart=toDateInput(new Date(today.getFullYear(),today.getMonth(),today.getDate()-29));
    }
    render(); return;
  }

  if(a==='download-data'){ downloadData(); return; }
});

const descSaveTimers={}; // per-entry debounce, so typing a description doesn't spam Firestore
document.addEventListener('input', e=>{
  if(e.target.matches('[data-action="draft-title"]')){
    const p=curProject();
    const d=pending[p.id]||{title:'',tagIds:[]}; d.title=e.target.value; pending[p.id]=d;
    // Toggle the Start button directly instead of a full render() so the
    // title input doesn't lose focus/cursor position while typing.
    const startBtn=document.querySelector('[data-action="start"]');
    if(startBtn){
      const empty=!d.title.trim();
      startBtn.disabled=empty;
      if(empty) startBtn.title='Enter a title to start the timer';
      else startBtn.removeAttribute('title');
    }
  }
  if(e.target.matches('[data-action="draft-desc"]')){
    const p=curProject();
    const d=pending[p.id]||{title:'',tagIds:[]}; d.description=e.target.value; pending[p.id]=d;
  }
  if(e.target.matches('[data-action="custom-start"]')){ customStart=e.target.value; render(); return; }
  if(e.target.matches('[data-action="custom-end"]')){ customEnd=e.target.value; render(); return; }
  if(e.target.matches('[data-action="entry-desc"]')){
    const id=e.target.dataset.id;
    const t=state.entries.find(x=>x.id===id); if(!t) return;
    t.description=e.target.value;
    clearTimeout(descSaveTimers[id]);
    descSaveTimers[id]=setTimeout(()=>saveEntry(id), 400);
  }
});

document.addEventListener('submit', e=>{
  const authForm=e.target.closest('[data-action="auth-form"]');
  if(authForm){
    e.preventDefault();
    const email=authForm.email.value.trim(), password=authForm.password.value;
    firebase.auth().signInWithEmailAndPassword(email,password)
      .catch(err=>{ authError=err.message; render(); });
    return;
  }
  const form=e.target.closest('[data-action="save-entry"]');
  if(!form) return;
  e.preventDefault();
  const en=state.entries.find(x=>x.id===form.dataset.id);
  const fd=new FormData(form);
  const title=(fd.get('title')||'').trim();
  if(!title){ alert('Title cannot be empty.'); return; }
  const start=new Date(fd.get('start')).getTime(), end=new Date(fd.get('end')).getTime();
  en.title=title;
  en.description=(fd.get('description')||'').trim();
  if(!isNaN(start)) en.start=start;
  if(!isNaN(end)) en.end=Math.max(end, en.start);
  editingEntryId=null; saveEntry(en.id); render();
});

setInterval(()=>{
  document.querySelectorAll('.live-clock').forEach(el=>{
    const start=+el.dataset.start, pauseStart=el.dataset.pausestart?+el.dataset.pausestart:0;
    const end = pauseStart || Date.now();
    el.textContent = fmtClock(end - start);
  });
}, 1000);

render();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
